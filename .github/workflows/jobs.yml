name: 热币交易 · 海报与台账任务
on:
  schedule:
    # 北京时间 18:00–22:59，每5分钟看一次有没有待办（文字稿通过后会排出海报和台账任务）。
    - cron: '*/5 10-14 * * 1-5'
    # 周日「下周清单」：北京时间 15:00–22:59（15:17 取数出稿，要留出审核和 20:00 发布的时间）。
    - cron: '*/5 7-14 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hotcoin-jobs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_INGEST_URL: ${{ secrets.WORKER_INGEST_URL }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 有没有待办任务
        id: peek
        run: python pipeline/job_runner.py --peek
      - name: 安装出图依赖
        if: steps.peek.outputs.has_job == 'true'
        run: |
          python -m pip install -r poster/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-liberation || true
      - name: 执行任务
        if: steps.peek.outputs.has_job == 'true'
        run: python pipeline/job_runner.py
