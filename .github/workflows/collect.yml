name: 热币交易 · 云端取数验证
on:
  schedule:
    # UTC 11:00 = 北京时间 19:00，给20:00中文稿预留审核时间。
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 额外热点代币，以空格分隔（选填）
        required: false
        default: ''
      replay_run_id:
        description: 只重试上传：填入一次已成功取数的运行编号（选填；快照必须在3小时内）
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: hotcoin-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 检查发布日历
        id: calendar
        run: |
          node --input-type=module - <<'JS'
          import {beijingDay,eligible} from './calendar.mjs';
          import {appendFileSync} from 'node:fs';
          const result=eligible(beijingDay());
          appendFileSync(process.env.GITHUB_OUTPUT,`proceed=${result.ok}\n`);
          console.log(beijingDay(),result.reason);
          JS
      - name: 安装数据依赖
        if: steps.calendar.outputs.proceed == 'true' && !inputs.replay_run_id
        run: python -m pip install -r pipeline/requirements.txt
      - name: 运行独立取数副本
        if: steps.calendar.outputs.proceed == 'true' && !inputs.replay_run_id
        env:
          EXTRA_SYMBOLS: ${{ inputs.symbols }}
        run: |
          python - <<'PYTHON'
          import os,subprocess,sys
          symbols=os.environ.get('EXTRA_SYMBOLS','').split()
          if any(not s.isalnum() or len(s)>30 for s in symbols):
              raise SystemExit('非法代币代码')
          subprocess.run([sys.executable,'pipeline/run_data.py',*symbols],check=True)
          PYTHON
      - name: 保存取数验证结果
        if: always() && steps.calendar.outputs.proceed == 'true' && !inputs.replay_run_id
        uses: actions/upload-artifact@v4
        with:
          name: hotcoin-collection-${{ github.run_id }}
          path: runtime/
          retention-days: 3
          if-no-files-found: ignore
      - name: 复用上次取数结果（仅重试上传）
        if: steps.calendar.outputs.proceed == 'true' && inputs.replay_run_id
        uses: actions/download-artifact@v4
        with:
          name: hotcoin-collection-${{ inputs.replay_run_id }}
          path: runtime
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 上传当日快照到审核后台
        if: steps.calendar.outputs.proceed == 'true' && success()
        env:
          WORKER_INGEST_URL: ${{ secrets.WORKER_INGEST_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: python pipeline/upload_snapshot.py runtime
